<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>

    <style>
        .done {text-decoration: line-through;
        color: grey;}
    </style>
</head>
<body>

    <input id="inputTaks">

    <button id ='buttonTask'>Add Task</button>

    <div id="divData"></div>

    <script>
        let dataInput = document.getElementById('inputTaks');
        let buttonData = document.getElementById('buttonTask');
        let divD = document.getElementById('divData')
        let tasks = [];

        
            buttonData.addEventListener('click',() =>
            {
                let li = document.createElement('li')
                tasks.push(dataInput.value)
                localStorage.setItem('tasks', JSON.stringify(tasks))
                li.innerHTML = `${dataInput.value} <button>Delete</button>`
                divD.appendChild(li);
                let deleteBtn = li.querySelector('button')

                deleteBtn.addEventListener('click',() => 
                {
                    li.remove();
                })

                li.addEventListener('click',() =>
                {
                    li.classList.toggle('done')
                })
            })

            let savedTasks = JSON.parse(localStorage.getItem('tasks')) || []

            savedTasks.forEach((taskText) => {
                let li = document.createElement('li')
                li.innerHTML = `${taskText} <button>Delete</button>`
                divD.appendChild(li)

                let deleteBtn = li.querySelector('button')
                deleteBtn.addEventListener('click', () => {
                    li.remove()
                })

                li.addEventListener('click', () => {
                    li.classList.toggle('done')
                })
            })

        
            

    </script>
</body>
</html>
